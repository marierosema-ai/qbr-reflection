<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBR Reflection Form</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 40px; color: #333; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="email"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; background-color: #3498db; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="form-container">
    <h1>QBR Reflection Form</h1>
    <form id="qbrForm">
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@company.com">
        </div>

        <div class="input-group">
            <label for="q1">What went well this quarter?</label>
            <textarea id="q1" required></textarea>
        </div>

        <div class="input-group">
            <label for="q2">What were the biggest roadblocks?</label>
            <textarea id="q2" required></textarea>
        </div>

        <button type="submit">Submit Reflection</button>
    </form>
</div>

<script>
    // Note: Make sure to replace this placeholder with your actual Google Apps Script Web App URL later!
    const WEB_APP_URL = https://script.google.com/a/macros/appfire.com/s/AKfycbz-Us_-91RgYRZtfAOh3O3oxGTmZfjqzzu8RssqWU1IbYAt7v975DgwtlfCHJjTjnCO/exec; 

    document.getElementById('qbrForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const payload = {
            email: document.getElementById('email').value,
            q1: document.getElementById('q1').value,
            q2: document.getElementById('q2').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('Reflection submitted successfully!');
            document.getElementById('qbrForm').reset();
        })
        .catch(error => alert('Error submitting: ' + error));
    });
</script>

</body>
</html>
