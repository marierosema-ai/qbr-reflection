<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBR Reflection Form</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; padding: 40px 20px; color: #1e293b; margin: 0; }
        .form-container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        h1 { color: #0f172a; font-size: 28px; margin-bottom: 8px; text-align: center; font-weight: 700; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 32px; }
        
        /* Progress Bar Tabs */
        .progress-container { display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; }
        .progress-line { position: absolute; top: 15px; left: 0; height: 2px; background: #e2e8f0; width: 100%; z-index: 1; }
        .progress-step { width: 32px; height: 32px; background: white; border: 2px solid #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 2; color: #64748b; transition: all 0.3s; }
        .progress-step.active { border-color: #3b82f6; background: #3b82f6; color: white; }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
        
        h2 { font-size: 20px; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 24px; }
        .item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
        h3 { font-size: 16px; margin-top: 0; color: #475569; border-bottom: 1px dashed #e2e8f0; padding-bottom: 6px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #334155; }
        input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; background: white; }
        textarea { height: 80px; resize: vertical; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 32px; }
        button { padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-next { background-color: #3b82f6; color: white; margin-left: auto; }
        .btn-next:hover { background-color: #2563eb; }
        .btn-prev { background-color: #e2e8f0; color: #475569; }
        .btn-prev:hover { background-color: #cbd5e1; }
        .btn-submit { background-color: #10b981; color: white; margin-left: auto; }
        .btn-submit:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="form-container">
    <h1>QBR Reflection</h1>
    <p class="subtitle">Continuous alignment, priority assessment, and bottleneck mapping.</p>
    
    <div class="progress-container">
        <div class="progress-line"></div>
        <div class="progress-step active">1</div>
        <div class="progress-step">2</div>
        <div class="progress-step">3</div>
        <div class="progress-step">4</div>
    </div>
